name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executable
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onedir --name PythonInPractice --add-data 'templates;templates' --add-data 'static;static' app.py
          cp build_windows.bat dist/PythonInPractice/
          7z a PythonInPractice-windows.zip ./dist/PythonInPractice/*
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PythonInPractice-windows
          path: PythonInPractice-windows.zip
      - name: Attach executable to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PythonInPractice-windows.zip
